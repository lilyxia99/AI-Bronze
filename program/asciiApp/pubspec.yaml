name: ascii_canvas
description: A touch-first ASCII art drawing app.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: AsciiCode
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
